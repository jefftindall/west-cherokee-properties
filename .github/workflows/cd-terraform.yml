# CD: terraform — apply staging/prod after merge. Plan IDs stay in docs, not the display name.
name: "CD: terraform"

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/cd-terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: wcp-cd-terraform
  cancel-in-progress: false

jobs:
  apply:
    name: Apply ${{ matrix.environment }}
    if: vars.AZURE_TF_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        environment: [staging, prod]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TF_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}

      # workflow GITHUB_TOKEN cannot read Actions env vars/secrets (403). Mint a
      # short-lived installation token from kv-wcp-shared instead of a PAT.
      - name: Mint GitHub App token
        id: gh_app
        env:
          GH_APP_ID: ${{ vars.GH_APP_ID }}
          GH_APP_INSTALLATION_ID: ${{ vars.GH_APP_INSTALLATION_ID }}
        run: bash scripts/mint-github-app-token.sh --from-keyvault kv-wcp-shared --github-output

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: infra/environments/${{ matrix.environment }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ vars.AZURE_TF_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TF_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}
          GITHUB_TOKEN: ${{ steps.gh_app.outputs.token }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -out=tfplan
          terraform apply -input=false tfplan
