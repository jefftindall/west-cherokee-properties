name: "CD: main"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: wcp-cd
  cancel-in-progress: false

jobs:
  build_release:
    name: Build release
    runs-on: ubuntu-latest
    env:
      PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Build
        run: |
          npm ci
          npm ci --prefix api
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist
            api

  deploy_staging:
    name: Deploy Staging
    needs: build_release
    if: vars.STAGING_HOSTNAME != ''
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      hostname: ${{ steps.host.outputs.hostname }}
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Staging noindex
        run: node scripts/apply-staging-noindex.mjs dist

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          skip_app_build: true
          skip_api_build: false

      - name: Resolve hostname
        id: host
        run: echo "hostname=${{ vars.STAGING_HOSTNAME }}" >> "$GITHUB_OUTPUT"

  smoke_staging:
    name: Smoke Staging
    needs: deploy_staging
    if: needs.deploy_staging.outputs.hostname != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke
        env:
          BASE_URL: https://${{ needs.deploy_staging.outputs.hostname }}
        run: npm run test:smoke

      - name: Journeys
        env:
          BASE_URL: https://${{ needs.deploy_staging.outputs.hostname }}
        run: npm run test:journey

  deploy_prod:
    name: Deploy Production
    needs: [build_release, smoke_staging]
    if: vars.PROD_HOSTNAME != ''
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          skip_app_build: true
          skip_api_build: false

  smoke_prod:
    name: Smoke Production
    needs: deploy_prod
    if: vars.PROD_HOSTNAME != ''
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke
        env:
          BASE_URL: https://${{ vars.PROD_HOSTNAME }}
        run: npm run test:smoke
